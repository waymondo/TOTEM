# RMK configuration for the 42-key TOTEM (38-key TOTEM + one extra key above
# each outer pinky key + one extra outer thumb key per side).
#
# Hardware: two Seeed XIAO nRF52840 (BLE), one per half. The left half is the
# BLE central (talks to the host), the right half is the peripheral.
#
# XIAO pin names -> nRF GPIO (from the TOTEM schematic):
#   ROW0 D0 P0_02   ROW1 D1 P0_03   ROW2 D2 P0_28   ROW3 D3 P0_29
#   COL0 D4 P0_04   COL1 D5 P0_05   COL2 D10 P1_15  COL3 D9 P1_14
#   COL4 D8 P1_13   COL5 D7 P1_12 (ex-RX; the TRRS jack is not populated)

[keyboard]
name = "TOTEM"
product_name = "TOTEM"
vendor_id = 0x3a3c
product_id = 0x0003
manufacturer = "GEIST"
chip = "nrf52840"

[storage]

[ble]
enabled = true
# Battery sensing on the XIAO nRF52840 requires pulling P0_14 low before reading
# the divider on P0_31; RMK's plain ADC config cannot do that, so it is left off.

[rmk]
ble_profiles_num = 3

# --------------------------------------------------------------------------
# Physical layout. The unified matrix is 4 rows x 12 cols:
#   cols 0..5  = left half  (COL0_L..COL5_L; COL0 is the pinky column,
#                            COL4 the index column, COL5 the new outer column)
#   cols 6..11 = right half (COL0_R..COL5_R, same meaning, mirrored)
#
# Key positions (row, col):
#   (3,0)/(3,6)   outer pinky key on the bottom row   (SWL16 / SWR16)
#   (1,5)/(1,11)  NEW key above the outer pinky key   (SWL20 / SWR20)
#   (3,2..4)      left thumbs, outer -> inner          (SWL17 / SWL18 / SWL19)
#   (3,5)         NEW left outer thumb                 (SWL21)
#   (3,8..10)     right thumbs, outer -> inner         (SWR17 / SWR18 / SWR19)
#   (3,11)        NEW right outer thumb                (SWR21)
# --------------------------------------------------------------------------
[layout]
rows = 4
cols = 12
map = """
[1]          (0,0,L,@c0)  (0,1,L,@c1)  (0,2,L,@c2)  (0,3,L,@c3)  (0,4,L,@c4)  [3]  (0,10,R,@c4)  (0,9,R,@c3)  (0,8,R,@c2)  (0,7,R,@c1)  (0,6,R,@c0)
(1,5,L,@c0)  (1,0,L,@c0)  (1,1,L,@c1)  (1,2,L,@c2)  (1,3,L,@c3)  (1,4,L,@c4)  [3]  (1,10,R,@c4)  (1,9,R,@c3)  (1,8,R,@c2)  (1,7,R,@c1)  (1,6,R,@c0)  (1,11,R,@c0)
(3,0,L,@c0)  (2,0,L,@c0)  (2,1,L,@c1)  (2,2,L,@c2)  (2,3,L,@c3)  (2,4,L,@c4)  [3]  (2,10,R,@c4)  (2,9,R,@c3)  (2,8,R,@c2)  (2,7,R,@c1)  (2,6,R,@c0)  (3,6,R,@c0)
[y=0.5] [2.4] (3,5,L) [0.2] (3,2,L) [0.2] (3,3,L) [0.2] (3,4,L) [1.0] (3,10,R) [0.2] (3,9,R) [0.2] (3,8,R) [0.2] (3,11,R)
"""

# Column stagger (render only), same offsets as the QMK layout.
[layout.shapes]
c0 = { y = 1.4 }
c1 = { y = 0.6 }
c2 = { y = 0.0 }
c3 = { y = 0.5 }
c4 = { y = 0.65 }

# --------------------------------------------------------------------------
# Split
# --------------------------------------------------------------------------
[split]
connection = "ble"

[split.central]
rows = 4
cols = 6
row_offset = 0
col_offset = 0

[split.central.matrix]
matrix_type = "normal"
row_pins = ["P0_02", "P0_03", "P0_28", "P0_29"]
col_pins = ["P0_04", "P0_05", "P1_15", "P1_14", "P1_13", "P1_12"]

[[split.peripheral]]
rows = 4
cols = 6
row_offset = 0
col_offset = 6

[split.peripheral.matrix]
matrix_type = "normal"
row_pins = ["P0_02", "P0_03", "P0_28", "P0_29"]
col_pins = ["P0_04", "P0_05", "P1_15", "P1_14", "P1_13", "P1_12"]

# --------------------------------------------------------------------------
# Keymap, ported from the QMK default keymap. Layers:
#   0 qwerty, 1 colemak, 2 lower, 3 raise, 4 adjust
# The four new keys default to: Tab / Quote (pinky-top L/R), Escape / Delete
# (outer thumb L/R). Everything is editable in Vial.
# --------------------------------------------------------------------------
[aliases]
qwerty  = "PDF(0)"
colemak = "PDF(1)"
# BLE profile keys (User0..2 select a profile, hold 5s to clear its bond)
bt0 = "User0"
bt1 = "User1"
bt2 = "User2"
bt_next = "User3"
bt_prev = "User4"
bt_clr = "User5"
out_tog = "User6"
clr_peer = "User7"

[keymap]
layers = 5

[[keymap.layer]]
name = "qwerty"
keys = """
            Q              W              E              R              T                  Y              U              I              O              P
Tab         MT(A, LGui)    MT(S, LAlt)    MT(D, LCtrl)   MT(F, LShift)  G                  H              MT(J, RShift)  MT(K, LCtrl)   MT(L, LAlt)    MT(Semicolon, LGui)  Quote
Q           Z              X              C              V              B                  N              M              Comma          Dot            Slash                P
Escape      Delete         LT(2, Tab)     Space                                            Enter          LT(3, Escape)  Backspace      Delete
"""

[[keymap.layer]]
name = "colemak"
keys = """
            Q              W              F              P              G                  J              L              U              Y              Semicolon
Tab         MT(A, LGui)    MT(R, LAlt)    MT(S, LCtrl)   MT(T, LShift)  D                  H              MT(N, RShift)  MT(E, LCtrl)   MT(I, LAlt)    MT(O, LGui)          Quote
Q           Z              X              C              V              B                  K              M              Comma          Dot            Slash                Semicolon
Escape      Delete         LT(2, Tab)     Space                                            Enter          LT(3, Escape)  Backspace      Delete
"""

[[keymap.layer]]
name = "lower"
keys = """
            CapsLock       NumLock        Up             Equal          SHIFTED(LeftBracket)   SHIFTED(RightBracket)  Kp7   Kp8   Kp9   KpPlus
_           Quote          Left           Down           Right          LeftBracket            RightBracket           Kp4   Kp5   Kp6   KpMinus      _
No          End            PageUp         WM(S, LCtrl)   PageDown       SHIFTED(Kc9)           SHIFTED(Kc0)           Kp1   Kp2   Kp3   KpAsterisk   _
_           _              _              _                                                    _                      MO(4) Kp0   _
"""

[[keymap.layer]]
name = "raise"
keys = """
            SHIFTED(Kc1)   SHIFTED(Kc2)   SHIFTED(Kc3)   SHIFTED(Kc4)   SHIFTED(Kc5)       SHIFTED(Kc6)   SHIFTED(Kc7)           WM(U, RAlt)   WM(Kc3, RAlt)  Backslash
_           WM(A, RAlt)    WM(F, RAlt)    WM(S, RAlt)    WM(G, RAlt)    No                 No             WM(Kc4, LShift | RAlt) WM(Kc5, RAlt) WM(Kc4, RAlt)  WM(O, RAlt)   _
No          SHIFTED(Grave) SHIFTED(Grave) WM(C, RAlt)    No             No                 No             No                     No            No             No            No
_           _              MO(4)          _                                                _              _                      _             _
"""

[[keymap.layer]]
name = "adjust"
keys = """
            Bootloader     No             No             No             No                 No             F7             F8             F9             F12
@bt0        @out_tog       @qwerty        No             No             No                 No             F4             F5             F6             F11            @bt_clr
@bt1        @bt2           @bt_next       @colemak       No             No                 No             F1             F2             F3             F10            F13
@clr_peer   _              _              _                                                _              _              _              @bt_prev
"""
